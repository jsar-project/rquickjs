name: CI coverage control
on: [pull_request]
jobs:
  coverage:
    runs-on: ubuntu-latest
    name: ubuntu / stable / coverage
    if: github.actor != 'dependabot[bot]'
    steps:
      - uses: actions/checkout@v6
        with:
          ref: 816d59cde38cb0f549238996398a4c823d46119f
          submodules: true
      - name: Install stable
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: llvm-tools-preview
      - name: cargo install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: cargo generate-lockfile
        if: hashFiles('Cargo.lock') == ''
        run: cargo generate-lockfile
      - name: cargo llvm-cov
        run: cargo llvm-cov --locked --no-default-features --features full-async,compile-tests,bindgen --workspace --lcov --output-path lcov.info
      - name: Print coverage summary
        run: |
          echo "Rust: $(rustc --version)"
          awk '
            /^LF:/ { lf += substr($0, 4) }
            /^LH:/ { lh += substr($0, 4) }
            /^FNF:/ { fnf += substr($0, 5) }
            /^FNH:/ { fnh += substr($0, 5) }
            END {
              if (lf > 0) {
                printf "Line coverage: %.2f%% (%d/%d)\n", (lh / lf) * 100, lh, lf;
              } else {
                print "Line coverage: n/a";
              }
              if (fnf > 0) {
                printf "Function coverage: %.2f%% (%d/%d)\n", (fnh / fnf) * 100, fnh, fnf;
              } else {
                print "Function coverage: n/a";
              }
            }
          ' lcov.info

